name: drop-local

services:
  nginx:
    image: nginx:alpine
    ports:
      - "4917:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: api
    environment:
      APP_NAME: Drop
      APP_ENV: local
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://drop:drop@postgres:5432/drop
      RABBITMQ_URL: amqp://drop:dropdropdrop@rabbitmq:5672//
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: drop
      S3_SECRET_KEY: dropdropdrop
      S3_BUCKET: drop
      S3_REGION: us-east-1
      MAX_UPLOAD_SIZE_BYTES: "104857600"
      DROP_TOKEN_PEPPER: local-drop-token-pepper-only-for-development
      SESSION_PEPPER: local-session-pepper-only-for-development
      TRUSTED_PROXY_IPS: 172.16.0.0/12
      SESSION_COOKIE_SECURE: "false"
      RATE_LIMIT_CREATE_MAX: "10"
      RATE_LIMIT_CREATE_WINDOW: "60"
      RATE_LIMIT_METADATA_MAX: "60"
      RATE_LIMIT_METADATA_WINDOW: "60"
      RATE_LIMIT_DOWNLOAD_MAX: "10"
      RATE_LIMIT_DOWNLOAD_WINDOW: "60"
      RATE_LIMIT_INVALID_TOKEN_MAX: "10"
      RATE_LIMIT_INVALID_TOKEN_WINDOW: "60"
      RATE_LIMIT_INVALID_TOKEN_BAN_SECONDS: "600"
      RATE_LIMIT_UPLOAD_MAX: "5"
      RATE_LIMIT_UPLOAD_WINDOW: "60"
      RATE_LIMIT_UPLOAD_BYTES: "524288000"
      RATE_LIMIT_UPLOAD_BYTES_WINDOW: "3600"
      RATE_LIMIT_DOWNLOAD_PER_DROP_MAX: "5"
      RATE_LIMIT_DOWNLOAD_PER_DROP_WINDOW: "60"
      RATE_LIMIT_DOWNLOAD_PER_SESSION_MAX: "10"
      RATE_LIMIT_DOWNLOAD_PER_SESSION_WINDOW: "60"
      DOWNLOAD_STREAM_LOCK_SECONDS: "300"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/health/live || exit 1" ]
      interval: 3s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: worker
    environment:
      APP_NAME: Drop
      APP_ENV: local
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://drop:drop@postgres:5432/drop
      RABBITMQ_URL: amqp://drop:dropdropdrop@rabbitmq:5672//
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: drop
      S3_SECRET_KEY: dropdropdrop
      S3_BUCKET: drop
      S3_REGION: us-east-1
      DROP_TOKEN_PEPPER: local-drop-token-pepper-only-for-development
      SESSION_PEPPER: local-session-pepper-only-for-development
      MAX_UPLOAD_SIZE_BYTES: "104857600"
      TRUSTED_PROXY_IPS: 172.16.0.0/12
      SESSION_COOKIE_SECURE: "false"
      RATE_LIMIT_CREATE_MAX: "10"
      RATE_LIMIT_CREATE_WINDOW: "60"
      RATE_LIMIT_METADATA_MAX: "60"
      RATE_LIMIT_METADATA_WINDOW: "60"
      RATE_LIMIT_DOWNLOAD_MAX: "10"
      RATE_LIMIT_DOWNLOAD_WINDOW: "60"
      RATE_LIMIT_INVALID_TOKEN_MAX: "10"
      RATE_LIMIT_INVALID_TOKEN_WINDOW: "60"
      RATE_LIMIT_INVALID_TOKEN_BAN_SECONDS: "600"
      RATE_LIMIT_UPLOAD_MAX: "5"
      RATE_LIMIT_UPLOAD_WINDOW: "60"
      RATE_LIMIT_UPLOAD_BYTES: "524288000"
      RATE_LIMIT_UPLOAD_BYTES_WINDOW: "3600"
      RATE_LIMIT_DOWNLOAD_PER_DROP_MAX: "5"
      RATE_LIMIT_DOWNLOAD_PER_DROP_WINDOW: "60"
      RATE_LIMIT_DOWNLOAD_PER_SESSION_MAX: "10"
      RATE_LIMIT_DOWNLOAD_PER_SESSION_WINDOW: "60"
      DOWNLOAD_STREAM_LOCK_SECONDS: "300"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: beat
    environment:
      APP_NAME: Drop
      APP_ENV: local
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://drop:drop@postgres:5432/drop
      RABBITMQ_URL: amqp://drop:dropdropdrop@rabbitmq:5672//
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: drop
      S3_SECRET_KEY: dropdropdrop
      S3_BUCKET: drop
      S3_REGION: us-east-1
      DROP_TOKEN_PEPPER: local-drop-token-pepper-only-for-development
      SESSION_PEPPER: local-session-pepper-only-for-development
      MAX_UPLOAD_SIZE_BYTES: "104857600"
      TRUSTED_PROXY_IPS: 172.16.0.0/12
      SESSION_COOKIE_SECURE: "false"
      RATE_LIMIT_CREATE_MAX: "10"
      RATE_LIMIT_CREATE_WINDOW: "60"
      RATE_LIMIT_METADATA_MAX: "60"
      RATE_LIMIT_METADATA_WINDOW: "60"
      RATE_LIMIT_DOWNLOAD_MAX: "10"
      RATE_LIMIT_DOWNLOAD_WINDOW: "60"
      RATE_LIMIT_INVALID_TOKEN_MAX: "10"
      RATE_LIMIT_INVALID_TOKEN_WINDOW: "60"
      RATE_LIMIT_INVALID_TOKEN_BAN_SECONDS: "600"
      RATE_LIMIT_UPLOAD_MAX: "5"
      RATE_LIMIT_UPLOAD_WINDOW: "60"
      RATE_LIMIT_UPLOAD_BYTES: "524288000"
      RATE_LIMIT_UPLOAD_BYTES_WINDOW: "3600"
      RATE_LIMIT_DOWNLOAD_PER_DROP_MAX: "5"
      RATE_LIMIT_DOWNLOAD_PER_DROP_WINDOW: "60"
      RATE_LIMIT_DOWNLOAD_PER_SESSION_MAX: "10"
      RATE_LIMIT_DOWNLOAD_PER_SESSION_WINDOW: "60"
      DOWNLOAD_STREAM_LOCK_SECONDS: "300"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: drop
      POSTGRES_USER: drop
      POSTGRES_PASSWORD: drop
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U drop -d drop" ]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: drop
      MINIO_ROOT_PASSWORD: dropdropdrop
    volumes:
      - minio_local_data:/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: drop
      RABBITMQ_DEFAULT_PASS: dropdropdrop
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit deprecated_features_permit_transient_nonexcl_queues true"
    volumes:
      - rabbitmq_local_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_local_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_local_data:
  minio_local_data:
  rabbitmq_local_data:
  redis_local_data:
