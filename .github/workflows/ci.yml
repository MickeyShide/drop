name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  ci:
    name: Code Quality, Tests & Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: 1. Ruff Linting
        run: uv run ruff check .

      - name: 2. Mypy Type Checking
        run: uv run mypy src

      - name: 3. Pytest (Unit & Integration Tests)
        env:
          APP_NAME: Drop
          APP_ENV: test
          DEBUG: false
          DATABASE_URL: postgresql+asyncpg://drop:drop@localhost:5432/drop_test
          RABBITMQ_URL: amqp://drop:drop@localhost:5672/
          REDIS_URL: redis://localhost:6379/0
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: drop
          S3_SECRET_KEY: dropdropdrop
          S3_BUCKET: drop-test
          S3_REGION: us-east-1
          MAX_UPLOAD_SIZE_BYTES: 104857600
          DROP_TOKEN_PEPPER: ci-only-drop-token-pepper
          SESSION_PEPPER: ci-only-session-pepper
          TRUSTED_PROXY_IPS: ""
          SESSION_COOKIE_SECURE: false
          RATE_LIMIT_CREATE_MAX: 10
          RATE_LIMIT_CREATE_WINDOW: 60
          RATE_LIMIT_METADATA_MAX: 60
          RATE_LIMIT_METADATA_WINDOW: 60
          RATE_LIMIT_DOWNLOAD_MAX: 10
          RATE_LIMIT_DOWNLOAD_WINDOW: 60
          RATE_LIMIT_INVALID_TOKEN_MAX: 10
          RATE_LIMIT_INVALID_TOKEN_WINDOW: 60
          RATE_LIMIT_INVALID_TOKEN_BAN_SECONDS: 600
          RATE_LIMIT_UPLOAD_MAX: 5
          RATE_LIMIT_UPLOAD_WINDOW: 60
          RATE_LIMIT_UPLOAD_BYTES: 524288000
          RATE_LIMIT_UPLOAD_BYTES_WINDOW: 3600
          RATE_LIMIT_DOWNLOAD_PER_DROP_MAX: 5
          RATE_LIMIT_DOWNLOAD_PER_DROP_WINDOW: 60
          RATE_LIMIT_DOWNLOAD_PER_SESSION_MAX: 10
          RATE_LIMIT_DOWNLOAD_PER_SESSION_WINDOW: 60
          DOWNLOAD_STREAM_LOCK_SECONDS: 300
        run: uv run pytest -v

      - name: 4. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 5. Docker Build
        run: docker build -t drop-api:latest .

  deploy:
    name: Deploy to Server via SSH
    needs: ci
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          SERVER_HOST: ${{ vars.SERVER_HOST }}
          SERVER_USER: ${{ vars.SERVER_USER }}
          SERVER_PORT: ${{ vars.SERVER_PORT }}
          TARGET_DIR: ${{ vars.TARGET_DIR }}
          NGINX_PORT: ${{ vars.NGINX_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          DROP_TOKEN_PEPPER: ${{ secrets.DROP_TOKEN_PEPPER }}
          SESSION_PEPPER: ${{ secrets.SESSION_PEPPER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
        run: |
          set -eu
          for name in SERVER_HOST SERVER_USER SERVER_PORT TARGET_DIR NGINX_PORT SERVER_SSH_KEY DROP_TOKEN_PEPPER SESSION_PEPPER POSTGRES_PASSWORD RABBITMQ_PASSWORD MINIO_ROOT_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required GitHub variable or secret is missing: $name"
              exit 1
            fi
          done

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          NGINX_PORT: ${{ vars.NGINX_PORT }}
          INFRA_USER: ${{ vars.INFRA_USER || 'shide' }}
          MINIO_ROOT_USER: ${{ vars.MINIO_ROOT_USER || 'shide' }}
          DROP_REDIS_DB: ${{ vars.DROP_REDIS_DB || '0' }}
          DROP_TOKEN_PEPPER: ${{ secrets.DROP_TOKEN_PEPPER }}
          SESSION_PEPPER: ${{ secrets.SESSION_PEPPER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ vars.SERVER_PORT }}
          envs: NGINX_PORT,INFRA_USER,MINIO_ROOT_USER,DROP_REDIS_DB,DROP_TOKEN_PEPPER,SESSION_PEPPER,POSTGRES_PASSWORD,RABBITMQ_PASSWORD,MINIO_ROOT_PASSWORD
          script: |
            set -e
            TARGET_DIR="${{ vars.TARGET_DIR }}"
            echo "1. Navigating to project directory: $TARGET_DIR"
            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR"

            echo "2. Pulling latest changes..."
            if [ ! -d ".git" ]; then
              git clone https://github.com/${{ github.repository }}.git .
            else
              git fetch --all
              git reset --hard origin/${{ github.ref_name }}
            fi

            umask 077
            cat > .env <<EOF
            NGINX_PORT=$NGINX_PORT
            INFRA_USER=$INFRA_USER
            MINIO_ROOT_USER=$MINIO_ROOT_USER
            DROP_REDIS_DB=$DROP_REDIS_DB
            DROP_TOKEN_PEPPER=$DROP_TOKEN_PEPPER
            SESSION_PEPPER=$SESSION_PEPPER
            POSTGRES_PASSWORD=$POSTGRES_PASSWORD
            RABBITMQ_PASSWORD=$RABBITMQ_PASSWORD
            MINIO_ROOT_PASSWORD=$MINIO_ROOT_PASSWORD
            EOF

            echo "3. Rebuilding Docker Compose containers..."
            docker compose up -d --build --remove-orphans

            echo "4. Restarting nginx to pick up config/frontend changes..."
            docker compose up -d --force-recreate --no-deps nginx

            echo "5. Verifying container health..."
            docker compose ps
