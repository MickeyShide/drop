global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    metrics_path: /prometheus/metrics
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: drop_api
    metrics_path: /metrics
    static_configs:
      - targets: ["drop-api:8000"]

  - job_name: celery_worker
    metrics_path: /metrics
    static_configs:
      - targets: ["drop-worker-metrics:8001"]

  - job_name: postgres
    static_configs:
      - targets: ["shide-postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["shide-redis-exporter:9121"]

  - job_name: rabbitmq
    static_configs:
      - targets: ["shide-rabbitmq:15692"]

  - job_name: minio
    metrics_path: /minio/metrics/v3
    static_configs:
      - targets: ["shide-minio:9000"]

  - job_name: nginx
    static_configs:
      - targets: ["drop-nginx-exporter:9113"]
