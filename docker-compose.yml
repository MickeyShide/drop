name: drop

networks:
  default:
    name: shide-observability
    external: true

services:
  nginx:
    image: nginx:alpine
    container_name: drop-nginx
    ports:
      - "${NGINX_PORT:?NGINX_PORT must be set}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drop-api
    command: api
    environment:
      - APP_NAME=Drop
      - APP_ENV=production
      - DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://${INFRA_USER:-shide}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@shide-postgres:5432/drop
      - RABBITMQ_URL=amqp://${INFRA_USER:-shide}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}@shide-rabbitmq:5672//drop
      - REDIS_URL=redis://shide-redis:6379/${DROP_REDIS_DB:-0}
      - S3_ENDPOINT=http://shide-minio:9000
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-shide}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      - S3_BUCKET=drop
      - S3_REGION=us-east-1
      - MAX_UPLOAD_SIZE_BYTES=104857600
      - DROP_TOKEN_PEPPER=${DROP_TOKEN_PEPPER:?DROP_TOKEN_PEPPER must be set}
      - SESSION_PEPPER=${SESSION_PEPPER:?SESSION_PEPPER must be set}
      - TRUSTED_PROXY_IPS=172.16.0.0/12
      - SESSION_COOKIE_SECURE=true
      - RATE_LIMIT_CREATE_MAX=10
      - RATE_LIMIT_CREATE_WINDOW=60
      - RATE_LIMIT_METADATA_MAX=60
      - RATE_LIMIT_METADATA_WINDOW=60
      - RATE_LIMIT_DOWNLOAD_MAX=10
      - RATE_LIMIT_DOWNLOAD_WINDOW=60
      - RATE_LIMIT_INVALID_TOKEN_MAX=10
      - RATE_LIMIT_INVALID_TOKEN_WINDOW=60
      - RATE_LIMIT_INVALID_TOKEN_BAN_SECONDS=600
      - RATE_LIMIT_UPLOAD_MAX=5
      - RATE_LIMIT_UPLOAD_WINDOW=60
      - RATE_LIMIT_UPLOAD_BYTES=524288000
      - RATE_LIMIT_UPLOAD_BYTES_WINDOW=3600
      - RATE_LIMIT_DOWNLOAD_PER_DROP_MAX=5
      - RATE_LIMIT_DOWNLOAD_PER_DROP_WINDOW=60
      - RATE_LIMIT_DOWNLOAD_PER_SESSION_MAX=10
      - RATE_LIMIT_DOWNLOAD_PER_SESSION_WINDOW=60
      - DOWNLOAD_STREAM_LOCK_SECONDS=300
      - LOG_FILE_PATH=/var/log/shide/drop-api.log
    volumes:
      - backend-logs-local:/var/log/shide
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/health/live || exit 1" ]
      interval: 3s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drop-worker
    command: worker
    environment:
      - APP_NAME=Drop
      - APP_ENV=production
      - DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://${INFRA_USER:-shide}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@shide-postgres:5432/drop
      - RABBITMQ_URL=amqp://${INFRA_USER:-shide}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}@shide-rabbitmq:5672//drop
      - REDIS_URL=redis://shide-redis:6379/${DROP_REDIS_DB:-0}
      - S3_ENDPOINT=http://shide-minio:9000
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-shide}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      - S3_BUCKET=drop
      - S3_REGION=us-east-1
      - MAX_UPLOAD_SIZE_BYTES=104857600
      - DROP_TOKEN_PEPPER=${DROP_TOKEN_PEPPER:?DROP_TOKEN_PEPPER must be set}
      - SESSION_PEPPER=${SESSION_PEPPER:?SESSION_PEPPER must be set}
      - TRUSTED_PROXY_IPS=172.16.0.0/12
      - SESSION_COOKIE_SECURE=true
      - RATE_LIMIT_CREATE_MAX=10
      - RATE_LIMIT_CREATE_WINDOW=60
      - RATE_LIMIT_METADATA_MAX=60
      - RATE_LIMIT_METADATA_WINDOW=60
      - RATE_LIMIT_DOWNLOAD_MAX=10
      - RATE_LIMIT_DOWNLOAD_WINDOW=60
      - RATE_LIMIT_INVALID_TOKEN_MAX=10
      - RATE_LIMIT_INVALID_TOKEN_WINDOW=60
      - RATE_LIMIT_INVALID_TOKEN_BAN_SECONDS=600
      - RATE_LIMIT_UPLOAD_MAX=5
      - RATE_LIMIT_UPLOAD_WINDOW=60
      - RATE_LIMIT_UPLOAD_BYTES=524288000
      - RATE_LIMIT_UPLOAD_BYTES_WINDOW=3600
      - RATE_LIMIT_DOWNLOAD_PER_DROP_MAX=5
      - RATE_LIMIT_DOWNLOAD_PER_DROP_WINDOW=60
      - RATE_LIMIT_DOWNLOAD_PER_SESSION_MAX=10
      - RATE_LIMIT_DOWNLOAD_PER_SESSION_WINDOW=60
      - DOWNLOAD_STREAM_LOCK_SECONDS=300
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus
      - LOG_FILE_PATH=/var/log/shide/drop-worker.log
    volumes:
      - worker_metrics_data:/tmp/prometheus
      - backend-logs-local:/var/log/shide

  worker-metrics:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drop-worker-metrics
    command: metrics
    environment:
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus
    volumes:
      - worker_metrics_data:/tmp/prometheus
    depends_on:
      worker:
        condition: service_started

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drop-beat
    command: beat
    environment:
      - APP_NAME=Drop
      - APP_ENV=production
      - DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://${INFRA_USER:-shide}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@shide-postgres:5432/drop
      - RABBITMQ_URL=amqp://${INFRA_USER:-shide}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}@shide-rabbitmq:5672//drop
      - REDIS_URL=redis://shide-redis:6379/${DROP_REDIS_DB:-0}
      - S3_ENDPOINT=http://shide-minio:9000
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-shide}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      - S3_BUCKET=drop
      - S3_REGION=us-east-1
      - MAX_UPLOAD_SIZE_BYTES=104857600
      - DROP_TOKEN_PEPPER=${DROP_TOKEN_PEPPER:?DROP_TOKEN_PEPPER must be set}
      - SESSION_PEPPER=${SESSION_PEPPER:?SESSION_PEPPER must be set}
      - TRUSTED_PROXY_IPS=172.16.0.0/12
      - SESSION_COOKIE_SECURE=true
      - RATE_LIMIT_CREATE_MAX=10
      - RATE_LIMIT_CREATE_WINDOW=60
      - RATE_LIMIT_METADATA_MAX=60
      - RATE_LIMIT_METADATA_WINDOW=60
      - RATE_LIMIT_DOWNLOAD_MAX=10
      - RATE_LIMIT_DOWNLOAD_WINDOW=60
      - RATE_LIMIT_INVALID_TOKEN_MAX=10
      - RATE_LIMIT_INVALID_TOKEN_WINDOW=60
      - RATE_LIMIT_INVALID_TOKEN_BAN_SECONDS=600
      - RATE_LIMIT_UPLOAD_MAX=5
      - RATE_LIMIT_UPLOAD_WINDOW=60
      - RATE_LIMIT_UPLOAD_BYTES=524288000
      - RATE_LIMIT_UPLOAD_BYTES_WINDOW=3600
      - RATE_LIMIT_DOWNLOAD_PER_DROP_MAX=5
      - RATE_LIMIT_DOWNLOAD_PER_DROP_WINDOW=60
      - RATE_LIMIT_DOWNLOAD_PER_SESSION_MAX=10
      - RATE_LIMIT_DOWNLOAD_PER_SESSION_WINDOW=60
      - DOWNLOAD_STREAM_LOCK_SECONDS=300
      - LOG_FILE_PATH=/var/log/shide/drop-beat.log
    volumes:
      - backend-logs-local:/var/log/shide

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    container_name: drop-nginx-exporter
    command: ["--nginx.scrape-uri=http://drop-nginx/nginx_status"]
    depends_on:
      nginx:
        condition: service_started

volumes:
  worker_metrics_data:
  backend-logs-local:
    external: true
    name: shide-backend-logs-local
