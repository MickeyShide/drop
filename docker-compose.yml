services:
  nginx:
    image: nginx:alpine
    container_name: drop-nginx
    ports:
      - "${NGINX_PORT:?NGINX_PORT must be set}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drop-api
    command: api
    environment:
      - APP_NAME=Drop
      - APP_ENV=production
      - DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://drop:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/drop
      - RABBITMQ_URL=amqp://drop:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}@rabbitmq:5672//
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=drop
      - S3_SECRET_KEY=${MINIO_PASSWORD:?MINIO_PASSWORD must be set}
      - S3_BUCKET=drop
      - S3_REGION=us-east-1
      - MAX_UPLOAD_SIZE_BYTES=104857600
      - DROP_TOKEN_PEPPER=${DROP_TOKEN_PEPPER:?DROP_TOKEN_PEPPER must be set}
      - SESSION_PEPPER=${SESSION_PEPPER:?SESSION_PEPPER must be set}
      - TRUSTED_PROXY_IPS=172.16.0.0/12
      - SESSION_COOKIE_SECURE=true
      - RATE_LIMIT_CREATE_MAX=10
      - RATE_LIMIT_CREATE_WINDOW=60
      - RATE_LIMIT_METADATA_MAX=60
      - RATE_LIMIT_METADATA_WINDOW=60
      - RATE_LIMIT_DOWNLOAD_MAX=10
      - RATE_LIMIT_DOWNLOAD_WINDOW=60
      - RATE_LIMIT_INVALID_TOKEN_MAX=10
      - RATE_LIMIT_INVALID_TOKEN_WINDOW=60
      - RATE_LIMIT_INVALID_TOKEN_BAN_SECONDS=600
      - RATE_LIMIT_UPLOAD_MAX=5
      - RATE_LIMIT_UPLOAD_WINDOW=60
      - RATE_LIMIT_UPLOAD_BYTES=524288000
      - RATE_LIMIT_UPLOAD_BYTES_WINDOW=3600
      - RATE_LIMIT_DOWNLOAD_PER_DROP_MAX=5
      - RATE_LIMIT_DOWNLOAD_PER_DROP_WINDOW=60
      - RATE_LIMIT_DOWNLOAD_PER_SESSION_MAX=10
      - RATE_LIMIT_DOWNLOAD_PER_SESSION_WINDOW=60
      - DOWNLOAD_STREAM_LOCK_SECONDS=300
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/health/live || exit 1" ]
      interval: 3s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: worker
    environment:
      - APP_NAME=Drop
      - APP_ENV=production
      - DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://drop:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/drop
      - RABBITMQ_URL=amqp://drop:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}@rabbitmq:5672//
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=drop
      - S3_SECRET_KEY=${MINIO_PASSWORD:?MINIO_PASSWORD must be set}
      - S3_BUCKET=drop
      - S3_REGION=us-east-1
      - MAX_UPLOAD_SIZE_BYTES=104857600
      - DROP_TOKEN_PEPPER=${DROP_TOKEN_PEPPER:?DROP_TOKEN_PEPPER must be set}
      - SESSION_PEPPER=${SESSION_PEPPER:?SESSION_PEPPER must be set}
      - TRUSTED_PROXY_IPS=172.16.0.0/12
      - SESSION_COOKIE_SECURE=true
      - RATE_LIMIT_CREATE_MAX=10
      - RATE_LIMIT_CREATE_WINDOW=60
      - RATE_LIMIT_METADATA_MAX=60
      - RATE_LIMIT_METADATA_WINDOW=60
      - RATE_LIMIT_DOWNLOAD_MAX=10
      - RATE_LIMIT_DOWNLOAD_WINDOW=60
      - RATE_LIMIT_INVALID_TOKEN_MAX=10
      - RATE_LIMIT_INVALID_TOKEN_WINDOW=60
      - RATE_LIMIT_INVALID_TOKEN_BAN_SECONDS=600
      - RATE_LIMIT_UPLOAD_MAX=5
      - RATE_LIMIT_UPLOAD_WINDOW=60
      - RATE_LIMIT_UPLOAD_BYTES=524288000
      - RATE_LIMIT_UPLOAD_BYTES_WINDOW=3600
      - RATE_LIMIT_DOWNLOAD_PER_DROP_MAX=5
      - RATE_LIMIT_DOWNLOAD_PER_DROP_WINDOW=60
      - RATE_LIMIT_DOWNLOAD_PER_SESSION_MAX=10
      - RATE_LIMIT_DOWNLOAD_PER_SESSION_WINDOW=60
      - DOWNLOAD_STREAM_LOCK_SECONDS=300
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus
    volumes:
      - worker_metrics_data:/tmp/prometheus
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

  worker-metrics:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drop-worker-metrics
    command: metrics
    environment:
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus
    volumes:
      - worker_metrics_data:/tmp/prometheus
    depends_on:
      worker:
        condition: service_started

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: beat
    environment:
      - APP_NAME=Drop
      - APP_ENV=production
      - DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://drop:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/drop
      - RABBITMQ_URL=amqp://drop:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}@rabbitmq:5672//
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=drop
      - S3_SECRET_KEY=${MINIO_PASSWORD:?MINIO_PASSWORD must be set}
      - S3_BUCKET=drop
      - S3_REGION=us-east-1
      - MAX_UPLOAD_SIZE_BYTES=104857600
      - DROP_TOKEN_PEPPER=${DROP_TOKEN_PEPPER:?DROP_TOKEN_PEPPER must be set}
      - SESSION_PEPPER=${SESSION_PEPPER:?SESSION_PEPPER must be set}
      - TRUSTED_PROXY_IPS=172.16.0.0/12
      - SESSION_COOKIE_SECURE=true
      - RATE_LIMIT_CREATE_MAX=10
      - RATE_LIMIT_CREATE_WINDOW=60
      - RATE_LIMIT_METADATA_MAX=60
      - RATE_LIMIT_METADATA_WINDOW=60
      - RATE_LIMIT_DOWNLOAD_MAX=10
      - RATE_LIMIT_DOWNLOAD_WINDOW=60
      - RATE_LIMIT_INVALID_TOKEN_MAX=10
      - RATE_LIMIT_INVALID_TOKEN_WINDOW=60
      - RATE_LIMIT_INVALID_TOKEN_BAN_SECONDS=600
      - RATE_LIMIT_UPLOAD_MAX=5
      - RATE_LIMIT_UPLOAD_WINDOW=60
      - RATE_LIMIT_UPLOAD_BYTES=524288000
      - RATE_LIMIT_UPLOAD_BYTES_WINDOW=3600
      - RATE_LIMIT_DOWNLOAD_PER_DROP_MAX=5
      - RATE_LIMIT_DOWNLOAD_PER_DROP_WINDOW=60
      - RATE_LIMIT_DOWNLOAD_PER_SESSION_MAX=10
      - RATE_LIMIT_DOWNLOAD_PER_SESSION_WINDOW=60
      - DOWNLOAD_STREAM_LOCK_SECONDS=300
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: drop-postgres
    environment:
      POSTGRES_DB: drop
      POSTGRES_USER: drop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U drop -d drop" ]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: drop-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: drop
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?MINIO_PASSWORD must be set}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - minio_data:/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: drop-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: drop
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit deprecated_features_permit_transient_nonexcl_queues true"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./docker/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: drop-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: drop-postgres-exporter
    environment:
      DATA_SOURCE_NAME: postgresql://drop:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/drop?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.80.0
    container_name: drop-redis-exporter
    command: ["--redis.addr=redis://redis:6379"]
    depends_on:
      redis:
        condition: service_healthy

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    container_name: drop-nginx-exporter
    command: ["--nginx.scrape-uri=http://nginx/nginx_status"]
    depends_on:
      nginx:
        condition: service_started

networks:
  default:
    name: shide-observability
    external: true

volumes:
  postgres_data:
  minio_data:
  rabbitmq_data:
  redis_data:
  worker_metrics_data:
